<!-- Social sharing buttons that appear below each post -->
<div class="share-buttons">
  <h3>Share this post:</h3>
  
  <!-- Twitter -->
  <a href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}&url={{ site.url }}{{ site.baseurl }}{{ page.url }}" 
     target="_blank" 
     class="share-button twitter"
     title="Share on Twitter">
    Twitter
  </a>
  
  <!-- LinkedIn -->
  <a href="https://www.linkedin.com/shareArticle?mini=true&url={{ site.url }}{{ site.baseurl }}{{ page.url }}&title={{ page.title | url_encode }}&summary={{ page.description | url_encode }}&source={{ site.title }}" 
     target="_blank" 
     class="share-button linkedin"
     title="Share on LinkedIn">
    LinkedIn
  </a>
  
  <!-- Email -->
  <a href="mailto:?subject={{ page.title | url_encode }}&body=Check out this post: {{ site.url }}{{ site.baseurl }}{{ page.url }}" 
     class="share-button email"
     title="Share via Email">
    Email
  </a>
</div>

<style>
  .share-buttons {
    margin: 30px 0;
    text-align: center;
  }
  
  .share-button {
    display: inline-block;
    margin: 0 5px;
    padding: 8px 16px;
    text-decoration: none;
    color: white;
    border-radius: 4px;
    font-weight: bold;
    transition: opacity 0.3s;
  }
  
  .share-button:hover {
    opacity: 0.9;
    text-decoration: none;
    color: white;
  }
  
  .twitter {
    background-color: #1DA1F2;
  }
  
  .linkedin {
    background-color: #0077B5;
  }
  
  .email {
    background-color: #777777;
  }
  
  @media (prefers-color-scheme: dark) {
    .share-button:hover {
      opacity: 0.8;
    }
  }
</style>
