layout: default

<style type="text/css" media="screen">
  .container-404 {
    margin: 30px auto;
    max-width: 600px;
    text-align: center;
  }
  .title-404 {
    margin: 30px 0;
    font-size: 4em;
    line-height: 1;
    letter-spacing: -1px;
    color: #2a7ae2;
  }
  .search-404 {
    margin: 30px auto;
    max-width: 400px;
  }
  .search-input-404 {
    width: 100%;
    padding: 10px;
    border: 1px solid #e8e8e8;
    border-radius: 4px;
    font-size: 16px;
  }
  .helpful-links {
    margin: 30px 0;
    padding: 0;
    list-style-type: none;
  }
  .helpful-links li {
    margin: 10px 0;
  }
  .back-home {
    display: inline-block;
    margin: 20px 0;
    padding: 10px 20px;
    background-color: #2a7ae2;
    color: white;
    text-decoration: none;
    border-radius: 4px;
    font-weight: bold;
  }
  .back-home:hover {
    background-color: #1756a9;
    text-decoration: none;
  }
  @media (prefers-color-scheme: dark) {
    .search-input-404 {
      background-color: #2d2d2d;
      color: #eee;
      border-color: #3d3d3d;
    }
    .title-404 {
      color: #4dabf7;
    }
    .back-home {
      background-color: #4dabf7;
    }
    .back-home:hover {
      background-color: #3793dd;
    }
  }
</style>

<div class="container-404">
  <h1 class="title-404">404</h1>

  <p><strong>Oops! Page not found</strong></p>
  <p>The page you're looking for doesn't exist or has been moved.</p>
  
  <div class="search-404">
    <p>Try searching for what you're looking for:</p>
    <form action="{{ '/search/' | relative_url }}" method="get">
      <input type="text" name="query" class="search-input-404" placeholder="Search...">
    </form>
  </div>
  
  <p>Or check out these helpful links:</p>
  <ul class="helpful-links">
    <li><a href="{{ '/' | relative_url }}">Home Page</a></li>
    <li><a href="{{ '/archives/' | relative_url }}">Archives</a></li>
    <li><a href="{{ '/tags/' | relative_url }}">Tags</a></li>
    <li><a href="{{ '/about/' | relative_url }}">About</a></li>
  </ul>
  
  <a href="{{ '/' | relative_url }}" class="back-home">Back to Home</a>
</div>

<script>
  // Focus the search input when the page loads
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelector('.search-input-404').focus();
  });
</script>
